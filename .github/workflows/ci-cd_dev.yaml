name: CI/CD Pipeline


on:
  push:
    branches:
      - "feature/*"  # Any branch starting with "feature/"
    # tags:
    #   - "v1.*"  # Any tag starting with "v1."

env:
  REGISTRY: docker.io
  IMAGE_NAME: koraichi/gitops-demo
  DEPLOYMENT_REPO: mkoraichi/gitops_app_deployment

jobs:
  build:
    runs-on: ubuntu-latest
    environment: "dev"
    steps:
    - name: Checkout application code
      uses: actions/checkout@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.run_number }}

  update-deploy-manifest:
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    steps:

    - name: Checkout Private Repository
      uses: actions/checkout@v4
      with:
        repository: ${{ env.DEPLOYMENT_REPO }}
        token: ${{ secrets.PAT_TOKEN }}
    - name: Update deployment repository
      env:
        GH_TOKEN: ${{ secrets.PAT_TOKEN }}
      run: |
        git clone https://${{ github.actor }}:${{ secrets.PAT_TOKEN }}@github.com/${{ env.DEPLOYMENT_REPO }}.git deployment-repo
        cd deployment-repo
        NEW_TAG="${{ github.run_number }}"
        
        # Update image tag in kustomize/overlays/dev/kustomization.yaml
        sed -i "s|newTag:.*|newTag: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$NEW_TAG|" kustomize/overlays/dev/kustomization.yaml
        
        # Commit and push changes
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git add .
        git commit -m "Update image tag to $NEW_TAG"
        git push origin main
